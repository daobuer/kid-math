<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="30以内加减法步进式练习工具" />
    <title>30以内加减法练习</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- 顶部导航栏 -->
    <header class="header">
      <h1 class="header-title">30以内加减法练习</h1>
      <button class="btn-new" id="btn-new">换一题</button>
    </header>

    <!-- 主卡片区域 -->
    <main class="main-card">
      <!-- 算式展示 -->
      <div class="problem-display" id="problem-display">
        <span class="num">--</span>
        <span class="op">+</span>
        <span class="num">--</span>
        <span class="eq">=</span>
        <span class="result-hidden">?</span>
      </div>

      <!-- 步骤标签 -->
      <div class="step-label" id="step-label">准备开始...</div>

      <!-- 可视化区域 -->
      <div class="visualization">
        <div class="viz-container" id="viz-container"></div>
      </div>

      <!-- 步骤指示器 -->
      <div class="step-indicators">
        <span class="step-dot active" data-step="0"></span>
        <span class="step-dot" data-step="1"></span>
        <span class="step-dot" data-step="2"></span>
        <span class="step-dot" data-step="3"></span>
      </div>

      <!-- 导航按钮 -->
      <div class="controls">
        <button class="btn-nav btn-prev" id="btn-prev" disabled>← 上一步</button>
        <button class="btn-nav btn-next" id="btn-next">下一步 →</button>
      </div>
    </main>

    <!-- 主脚本入口 -->
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
